name: Update Projects List

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'proyectos/**'
      - '!proyectos/**/target/**'
      - '!proyectos/**/.idea/**'
      - '!proyectos/**/.mvn/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'proyectos/**'
  workflow_dispatch:  # Permite ejecución manual
  schedule:
    - cron: '0 12 * * 1'  # Ejecutar cada lunes a las 12:00 UTC

jobs:
  update-readme:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pull-requests: write
      issues: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: ${{ github.head_ref || github.ref }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Update README
      id: update
      run: |
        python .github/scripts/update-readme.py
        echo "updated=$(git status --porcelain README.md | wc -l)" >> $GITHUB_OUTPUT

    - name: Debug - Show git status
      if: steps.update.outputs.updated > 0
      run: |
        echo "📊 Estado del repositorio:"
        git status
        echo ""
        echo "📝 Cambios en README.md:"
        git diff README.md --stat || true
        echo ""
        echo "📅 Evento: ${{ github.event_name }}"
        echo "🏷️ Rama actual: ${{ github.ref }}"
        echo "🏷️ Base ref: ${{ github.base_ref }}"
        echo "🏷️ Head ref: ${{ github.head_ref }}"
        echo "📦 updated output: ${{ steps.update.outputs.updated }}"

    # 1. Push directo a develop (si ya estamos en develop)
    - name: Commit and push changes (direct push to develop)
      if: steps.update.outputs.updated > 0 && github.event_name == 'push' && github.ref == 'refs/heads/develop'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add README.md
        git commit -m "📚 Actualizar lista de proyectos automáticamente"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # 2. Crear PR automático desde main/schedule hacia develop
    - name: Create Pull Request to develop
      id: create-pr
      if: steps.update.outputs.updated > 0 && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "📚 Actualizar lista de proyectos automáticamente"
        title: "📊 Actualización automática de proyectos"
        body: |
          ## 📊 Actualización automática de proyectos
          
          Este PR actualiza automáticamente la lista de proyectos en el README.md basado en la estructura actual de directorios.
          
          ### 📈 Proyectos detectados:
          El script encontró y actualizó las tablas de proyectos.
          
          ---
          
          *Esta actualización fue generada automáticamente por GitHub Actions.*
          *PR será mergeado y la rama eliminada automáticamente.*
        branch: auto-update/readme-${{ github.sha }}
        delete-branch: true  # IMPORTANTE: Esto elimina la rama después del merge
        add-paths: README.md
        labels: automated,documentation,auto-merge
        base: develop
        draft: false

    # 3. Auto-merge del PR creado y eliminar rama
    - name: Auto-merge PR and cleanup
      if: steps.create-pr.outputs.pull-request-number != '' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push')
      uses: actions/github-script@v6
      with:
        script: |
          const prNumber = ${{ steps.create-pr.outputs.pull-request-number }};
          const [owner, repo] = context.payload.repository.full_name.split('/');
          
          console.log(`🔄 Procesando PR #${prNumber}...`);
          
          try {
            // 1. Primero mergear el PR
            console.log(`📤 Mergeando PR #${prNumber} a develop...`);
            const mergeResult = await github.rest.pulls.merge({
              owner: owner,
              repo: repo,
              pull_number: prNumber,
              merge_method: 'squash',
              commit_title: '📚 Actualizar lista de proyectos automáticamente',
              commit_message: 'Merge automático de actualización de README'
            });
            
            console.log(`✅ PR #${prNumber} mergeado exitosamente`);
            
            // 2. La rama se elimina automáticamente por create-pull-request
            // Pero verificamos por si acaso
            try {
              const prData = await github.rest.pulls.get({
                owner: owner,
                repo: repo,
                pull_number: prNumber
              });
              
              const branchName = prData.data.head.ref;
              console.log(`🗑️ La rama '${branchName}' será eliminada automáticamente por delete-branch: true`);
              
            } catch (error) {
              console.log(`ℹ️ No se pudo obtener info de la rama: ${error.message}`);
            }
            
          } catch (error) {
            console.log(`❌ Error al mergear PR #${prNumber}: ${error.message}`);
            
            // Si falla el merge, intentamos eliminar la rama manualmente
            if (error.message.includes('merge') || error.status === 405) {
              console.log('🔄 Intentando eliminar la rama manualmente...');
              
              try {
                // Obtener nombre de la rama del PR
                const prData = await github.rest.pulls.get({
                  owner: owner,
                  repo: repo,
                  pull_number: prNumber
                });
                
                const branchName = prData.data.head.ref;
                
                // Eliminar la rama
                await github.rest.git.deleteRef({
                  owner: owner,
                  repo: repo,
                  ref: `heads/${branchName}`
                });
                
                console.log(`✅ Rama '${branchName}' eliminada manualmente`);
                
              } catch (deleteError) {
                console.log(`⚠️ No se pudo eliminar la rama: ${deleteError.message}`);
              }
            }
          }
        github-token: ${{ secrets.GITHUB_TOKEN }}

    # 4. Crear PR desde develop a main (solo cuando se hace push a develop)
    - name: Create Pull Request to main (from develop)
      if: steps.update.outputs.updated > 0 && github.event_name == 'push' && github.ref == 'refs/heads/develop'
      id: pr-to-main
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "📚 Actualizar README con nuevos proyectos"
        title: "📈 Actualizar README desde develop"
        body: |
          ## 📊 Actualización de README desde develop
          
          Esta actualización incluye los cambios del README.md desde la rama develop.
          
          ### 📋 Contenido:
          - Lista de proyectos actualizada
          - Conteo de proyectos por nivel
          
          ---
          
          *Generado automáticamente desde el flujo de integración.*
          *Este PR requiere revisión manual antes de mergear a main.*
        branch: update/readme-to-main-${{ github.sha }}
        delete-branch: true  # También elimina esta rama después de merge
        add-paths: README.md
        labels: documentation,release,needs-review
        base: main
        draft: false

    - name: No changes
      if: steps.update.outputs.updated == 0
      run: |
        echo "✅ No hay cambios en el README.md"
        echo "Rama: ${{ github.ref }}"
        echo "Evento: ${{ github.event_name }}"